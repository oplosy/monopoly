services:
  app:
    build: .
    image: deal-city
    restart: unless-stopped
    # Server settings (TURN_MS, MAX_ROOMS, ...) come from an optional .env file next to this one.
    env_file:
      - path: .env
        required: false
    # Only Caddy is published; the app listens on 3000 inside the compose network.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
